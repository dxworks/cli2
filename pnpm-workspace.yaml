packages:
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

autoInstallPeers: true

minimumReleaseAgeExclude:
  - axios@1.21.1

# Security overrides for transitive deps pinned to vulnerable versions (mostly by nx).
overrides:
  axios: ^1.21.1
  brace-expansion@5: ^5.0.12
  follow-redirects: ^1.16.2
  minimatch@>=7 <11.0.1: ^11.0.5
  smol-toml: ^1.9.1
